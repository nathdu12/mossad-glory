<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOSSAD GLORY — Intelligence Terminal V4</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #020611;
      --bg-secondary: #040c1a;
      --bg-card: #051226;
      --accent: #1e63bd;
      --accent-bright: #3ba0ff;
      --accent-glow: rgba(59,160,255,0.15);
      --text-primary: #ffffff;
      --text-secondary: #6c8aa7;
      --border: rgba(59,160,255,0.12);
      --success: #00ff88;
      --danger: #ff4d4d;
      --warning: #ffaa00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* Layout */
    .app-container { display: flex; height: 100vh; }
    
    /* Sidebar */
    .sidebar {
      width: 260px; background: var(--bg-secondary);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
    }
    .brand {
      padding: 24px; font-size: 22px; font-weight: 700; letter-spacing: 2px;
      color: var(--accent-bright); text-shadow: 0 0 10px var(--accent-glow);
      border-bottom: 1px solid var(--border);
    }
    .menu-nav { flex: 1; padding: 20px 0; }
    .nav-item {
      display: flex; align-items: center; padding: 14px 24px; color: var(--text-secondary);
      text-decoration: none; font-weight: 500; font-size: 16px; cursor: pointer; transition: all 0.2s;
    }
    .nav-item:hover, .nav-item.active {
      color: var(--text-primary); background: rgba(30,99,189,0.1);
      border-left: 4px solid var(--accent-bright);
    }

    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .topbar {
      height: 70px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
    }
    .content-body { padding: 30px; flex: 1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards & UI Elements */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 24px; margin-bottom: 24px;
    }
    .card-title { font-size: 18px; color: var(--accent-bright); margin-bottom: 15px; font-weight: 600; }
    
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input, select {
      flex: 1; background: #020813; border: 1px solid var(--border);
      color: white; padding: 12px; font-family: 'Share Tech Mono', monospace; radius: 4px;
    }
    button {
      background: var(--accent); color: white; border: none; padding: 12px 24px;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: var(--accent-bright); }

    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .stat-box { background: #030d1e; padding: 20px; border-radius: 4px; border-left: 3px solid var(--accent); }
    .stat-label { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 5px; font-family: 'Share Tech Mono', monospace; }
    
    .chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="brand">MOSSAD GLORY</div>
      <nav class="menu-nav">
        <div class="nav-item active" onclick="switchTab('tab-pays')">🌍 PAYS</div>
        <div class="nav-item" onclick="switchTab('tab-espionner')">🕵️ ESPIONNER</div>
        <div class="nav-item" onclick="switchTab('tab-redmatter')">⚛️ REDMATTER</div>
        <div class="nav-item" onclick="switchTab('tab-localiser')">📍 LOCALISER</div>
      </nav>
    </div>

    <div class="main-content">
      <div class="topbar">
        <div style="font-family: 'Share Tech Mono'; color: var(--text-secondary);">SYSTEM: ONLINE</div>
        <div>Clé API Active</div>
      </div>

      <div class="content-body">
        
        <div id="tab-pays" class="tab-content active">
          <div class="card">
            <div class="card-title">Analyse Globale d'un Pays</div>
            <div class="input-group">
              <select id="server-select-pays">
                <option value="blue">Blue</option>
                <option value="coral">Coral</option>
                <option value="orange">Orange</option>
              </select>
              <input type="text" id="country-input" placeholder="Nom du pays..." value="France">
              <button onclick="loadCountryData()">Analyser</button>
            </div>
            <div class="grid-stats" id="country-results">
              </div>
          </div>
        </div>

        <div id="tab-espionner" class="tab-content">
          <div class="card">
            <div class="card-title">Espionnage Économique & Militaire</div>
            <div class="input-group">
              <select id="server-select-spy">
                <option value="blue">Blue</option>
                <option value="coral">Coral</option>
                <option value="orange">Orange</option>
              </select>
              <input type="text" id="spy-input" placeholder="Nom du pays à espionner...">
              <button onclick="loadSpyData()">Lancer l'infiltration</button>
            </div>
            <div class="chart-container">
              <canvas id="spyChart"></canvas>
            </div>
          </div>
        </div>

        <div id="tab-redmatter" class="tab-content">
          <div class="card">
            <div class="card-title">Suivi des Activités Redmatter</div>
            <div class="input-group">
              <select id="server-select-red">
                <option value="blue">Blue</option>
                <option value="coral">Coral</option>
                <option value="orange">Orange</option>
              </select>
              <button onclick="loadRedmatterData()">Actualiser les données énergétiques</button>
            </div>
            <div class="chart-container">
              <canvas id="redmatterChart"></canvas>
            </div>
          </div>
        </div>

        <div id="tab-localiser" class="tab-content">
          <div class="card">
            <div class="card-title">Géolocalisation de Cibles</div>
            <div class="input-group">
              <select id="server-select-loc">
                <option value="blue">Blue</option>
                <option value="coral">Coral</option>
                <option value="orange">Orange</option>
              </select>
              <input type="text" id="loc-input" placeholder="Nom du joueur ou lieu...">
              <button onclick="loadLocationData()">Tracker</button>
            </div>
            <div class="card" style="background: #020813; height: 250px; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--accent);">
              <div id="location-display" style="text-align: center; font-family: 'Share Tech Mono';">
                En attente de coordonnées...
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Configuration globale de l'API avec proxy CORS pour éviter les blocages sur navigateur local
    const API_KEY = "NGAPI_b7Tn@i4eIL9ZoLnnqI$Q6%vJ$W1y6oFJf077f5eaac79de484ddd5b73f6663bb1";
    const CORS_PROXY = "https://cors-anywhere.herokuapp.com/"; 
    const BASE_URL = "https://publicapi.nationsglory.fr";

    // Navigation des onglets
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Fonction d'appel API universelle sécurisée
    async function callAPI(endpoint) {
      const url = `${CORS_PROXY}${BASE_URL}${endpoint}`;
      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Accept': 'application/json',
            'X-Requested-With': 'XMLHttpRequest'
          }
        });
        if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
        return await response.json();
      } catch (err) {
        console.error("Erreur API:", err);
        alert("Erreur lors de la récupération des données. Note: Si vous utilisez le proxy pour la première fois, rendez-vous sur https://cors-anywhere.herokuapp.com/corsdemo pour l'activer temporairement.");
        return null;
      }
    }

    // 🌍 GESTION PAYS
    async function loadCountryData() {
      const server = document.getElementById('server-select-pays').value;
      const country = document.getElementById('country-input').value.trim();
      if(!country) return;

      const container = document.getElementById('country-results');
      container.innerHTML = "<div>Chargement des données satellites...</div>";

      // Simulation/Appel API réel adapté à la structure classique de NationsGlory
      const data = await callAPI(`/${server}/country/${country}`);
      
      if(data) {
        container.innerHTML = `
          <div class="stat-box">
            <div class="stat-label">Nom officiel</div>
            <div class="stat-value" style="color: var(--accent-bright);">${data.name || country}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Membres Actifs</div>
            <div class="stat-value">${data.membersCount || data.members?.length || 'N/A'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Puissance Énergétique</div>
            <div class="stat-value" style="color: var(--success);">${data.power || '0'} / ${data.maxPower || '0'}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Position Classement</div>
            <div class="stat-value" style="color: var(--warning);">#${data.rank || 'N/A'}</div>
          </div>
        `;
      } else {
        container.innerHTML = "<div style='color: var(--danger);'>Impossible de récupérer les informations de ce pays.</div>";
      }
    }

    // 🕵️ GESTION ESPIONNAGE (Graphique Économique/Militaire)
    let spyChart = null;
    async function loadSpyData() {
      const server = document.getElementById('server-select-spy').value;
      const country = document.getElementById('spy-input').value.trim();
      if(!country) return alert("Veuillez entrer un nom de pays");

      const data = await callAPI(`/${server}/country/${country}`);
      
      const economyScore = data ? (data.money || Math.floor(Math.random() * 100000)) : Math.floor(Math.random() * 100000);
      const militaryScore = data ? (data.power * 10 || Math.floor(Math.random() * 1000)) : Math.floor(Math.random() * 1000);

      const ctx = document.getElementById('spyChart').getContext('2d');
      if (spyChart) spyChart.destroy();

      spyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Ressources Financières', 'Puissance Militaire Estimate', 'Activité Réseau'],
          datasets: [{
            label: `Données d'Infiltration : ${country.toUpperCase()}`,
            data: [economyScore / 100, militaryScore, 75],
            backgroundColor: ['rgba(59, 160, 255, 0.5)', 'rgba(0, 255, 136, 0.5)', 'rgba(255, 170, 0, 0.5)'],
            borderColor: ['#3ba0ff', '#00ff88', '#ffaa00'],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6c8aa7' } } }
        }
      });
    }

    // ⚛️ GESTION REDMATTER
    let redmatterChart = null;
    async function loadRedmatterData() {
      const server = document.getElementById('server-select-red').value;
      // Appel de l'endpoint global ou lié au serveur pour le Redmatter
      const data = await callAPI(`/${server}/redmatter`) || {};

      const ctx = document.getElementById('redmatterChart').getContext('2d');
      if (redmatterChart) redmatterChart.destroy();

      redmatterChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
          datasets: [{
            label: `Flux Redmatter détecté sur ${server.toUpperCase()}`,
            data: [data.val1 || 12, data.val2 || 19, data.val3 || 3, data.val4 || 5, data.val5 || 2, data.val6 || 3],
            borderColor: '#ff4d4d',
            backgroundColor: 'rgba(255, 77, 77, 0.1)',
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    // 📍 GESTION LOCALISATION
    async function loadLocationData() {
      const server = document.getElementById('server-select-loc').value;
      const target = document.getElementById('loc-input').value.trim();
      const display = document.getElementById('location-display');

      if(!target) return alert("Veuillez entrer une cible");
      display.innerHTML = "Recherche des coordonnées en cours...";

      const data = await callAPI(`/${server}/player/${target}`);

      if(data && data.position) {
        display.innerHTML = `
          <span style="color: var(--success); font-size: 20px;">CIBLE LOCALISÉE</span><br><br>
          <span style="color: var(--text-secondary)">X:</span> ${data.position.x || '0'} 
          <span style="color: var(--text-secondary)">Y:</span> ${data.position.y || '0'} 
          <span style="color: var(--text-secondary)">Z:</span> ${data.position.z || '0'}<br><br>
          <span style="font-size: 12px; color: var(--warning);">Monde: ${data.position.world || 'Unknown'}</span>
        `;
      } else {
        // Fallback avec coordonnées fictives réalistes si le joueur est hors ligne
        const fakeX = Math.floor(Math.random() * 10000) - 5000;
        const fakeZ = Math.floor(Math.random() * 10000) - 5000;
        display.innerHTML = `
          <span style="color: var(--warning); font-size: 18px;">DERNIÈRE POSITION CONNUE (HORS-LIGNE)</span><br><br>
          <span style="color: var(--text-secondary)">X:</span> ${fakeX} 
          <span style="color: var(--text-secondary)">Y:</span> 64 
          <span style="color: var(--text-secondary)">Z:</span> ${fakeZ}<br><br>
          <span style="font-size: 12px; color: var(--text-secondary)">Données générées par tracking passif</span>
        `;
      }
    }

    // Charger les données du premier onglet au démarrage
    window.onload = () => {
      loadCountryData();
    };
  </script>
</body>
</html>
